name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish (framework-dependent)
        run: >
          dotnet publish ./VortexModLists.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:PublishSingleFile=false
          -p:DebugType=None
          -p:DebugSymbols=false
          -o ./publish/win-x64

      - name: Download .NET Desktop Runtime installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ./publish/installer -Force | Out-Null
          Invoke-WebRequest -Uri "https://builds.dotnet.microsoft.com/dotnet/WindowsDesktop/10.0.0/windowsdesktop-runtime-10.0.0-win-x64.exe" -OutFile ./publish/installer/windowsdesktop-runtime-10.0.0-win-x64.exe

      - name: Build MSI installer
        run: >
          dotnet build ./installer/VortexModLists.Installer.Msi/VortexModLists.Installer.Msi.wixproj
          -c Release
          -p:PublishDir=${{ github.workspace }}\publish\win-x64

      - name: Build bootstrapper EXE
        run: >
          dotnet build ./installer/VortexModLists.Installer.Bundle/VortexModLists.Installer.Bundle.wixproj
          -c Release
          -p:DotNetDesktopRuntimePath=${{ github.workspace }}\publish\installer\windowsdesktop-runtime-10.0.0-win-x64.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./publish/installer/VortexModLists-Setup.exe
            ./publish/installer/VortexModLists.msi
          generate_release_notes: true