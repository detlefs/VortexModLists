name: Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore ./VortexModLists.csproj

      - name: Publish (self-contained, single-file)
        run: >
          dotnet publish ./VortexModLists.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o ./publish/win-x64

      - name: Remove PDB files
        shell: pwsh
        run: Get-ChildItem -Path ./publish/win-x64 -Filter *.pdb -Recurse | Remove-Item -Force

      - name: Create ZIP package
        shell: pwsh
        run: |
          Compress-Archive `
            -Path ./publish/win-x64/* `
            -DestinationPath ./publish/VortexModLists-win-x64.zip `
            -Force

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: VortexModLists-win-x64
          path: ./publish/VortexModLists-win-x64.zip
          retention-days: 14
